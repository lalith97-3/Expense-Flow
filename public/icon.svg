<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#10B981" stroke-opacity="0.2" stroke-width="2"/>
  
  <!-- Subtle circular radar lines -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="4 6"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#1E293B" stroke-width="1"/>
  
  <!-- Glow Behind Emblem -->
  <circle cx="256" cy="256" r="100" fill="url(#accentGlow)" filter="url(#glow)"/>

  <!-- Rupee Symbol + Flow Graphics -->
  <g fill="none" stroke="url(#emeraldGrad)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Bar 1 -->
    <path d="M 170 170 L 330 170" stroke-width="26" />
    <!-- Top Bar 2 -->
    <path d="M 170 230 L 305 230" stroke-width="26" />
    <!-- Vertical stem -->
    <path d="M 215 170 L 215 342" stroke-width="26" />
    <!-- Curved loop -->
    <path d="M 215 170 C 295 170, 325 210, 320 250 C 315 285, 275 300, 215 300" stroke-width="26" />
    <!-- Dynamic forward leg slash -->
    <path d="M 220 295 L 335 342" stroke-width="26" />
  </g>

  <!-- Flow upward pulse dot -->
  <circle cx="355" cy="165" r="12" fill="#34D399" />
  <circle cx="355" cy="165" r="22" fill="none" stroke="#34D399" stroke-width="3" opacity="0.6"/>
</svg>
