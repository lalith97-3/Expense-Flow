<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        // Intercept Vite HMR WebSocket in preview iframe where HMR is disabled
        const NativeWebSocket = window.WebSocket;
        if (NativeWebSocket) {
          window.WebSocket = function(url, protocols) {
            const isViteHMR =
              protocols === 'vite-hmr' ||
              (Array.isArray(protocols) && protocols.includes('vite-hmr')) ||
              (typeof url === 'string' && (url.includes('@vite') || url.includes('vite') || url.includes('/?t=')));

            if (isViteHMR) {
              const listeners = {};
              const dummy = {
                url: String(url),
                readyState: 1, // WebSocket.OPEN
                bufferedAmount: 0,
                extensions: '',
                protocol: 'vite-hmr',
                binaryType: 'blob',
                addEventListener(event, fn) {
                  listeners[event] = listeners[event] || [];
                  listeners[event].push(fn);
                  if (event === 'open') {
                    setTimeout(() => {
                      try { fn({ type: 'open', target: dummy }); } catch {}
                    }, 0);
                  }
                },
                removeEventListener(event, fn) {
                  if (listeners[event]) {
                    listeners[event] = listeners[event].filter(cb => cb !== fn);
                  }
                },
                dispatchEvent() { return true; },
                send() {},
                close() {
                  dummy.readyState = 3;
                  if (listeners['close']) {
                    listeners['close'].forEach(cb => {
                      try { cb({ type: 'close', wasClean: true, code: 1000, reason: '' }); } catch {}
                    });
                  }
                },
                set onopen(fn) {
                  if (fn) dummy.addEventListener('open', fn);
                },
                get onopen() { return null; },
                set onclose(fn) {
                  if (fn) dummy.addEventListener('close', fn);
                },
                get onclose() { return null; },
                set onerror(fn) {},
                get onerror() { return null; },
                set onmessage(fn) {},
                get onmessage() { return null; },
              };
              return dummy;
            }
            return new NativeWebSocket(url, protocols);
          };

          window.WebSocket.prototype = NativeWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        // Suppress console.error for any residual Vite messages
        const origError = console.error;
        console.error = function(...args) {
          if (args.length > 0) {
            const first = args[0];
            const msg = String((first && (first.message || first)) || '');
            if (msg.includes('WebSocket') || msg.includes('[vite]')) {
              return;
            }
          }
          origError.apply(console, args);
        };

        window.addEventListener('error', function(e) {
          if (e && e.message && (e.message.includes('WebSocket') || e.message.includes('[vite]'))) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          if (e && e.reason && String(e.reason).includes('WebSocket')) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
